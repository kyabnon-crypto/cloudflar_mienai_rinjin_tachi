for(let i=0;i<26;i++){const side=rnd()<.5?-1:1,x=rnd()<.5?side*(3.8+rnd()*1.8):(rnd()*8-4),z=rnd()<.5?-2.6+rnd()*7:-9+rnd()*6;if(Math.abs(x)<3.3&&z<-3)continue;const r=.35+rnd()*.7,s=add(sph(r,12,8),snowM,x,0,z);s.scale.set(1,.12+rnd()*.1,.8)}

const plume=[];for(let i=0;i<44;i++){const w=glow(0xffe8cc,1,0,0,0,0);w.material.fog=false;w.userData={p:i/44,a:i*1.7,src:i%3==2?1:0};plume.push(w)}

const caps=[[0,''],[4,'凍えるような真冬の夜、古い自動販売機がひとつ。'],[9,'その裏から、ふわりと小さな湯気が立っています。'],[14,'近づくと、ほんのり暖かい場所。'],[19,'ここは、ヌクモリの部屋。'],
[24,'古い温度調整機が、ことこと動いています。'],[29,'ダイヤルの針は、街の“寒さ”を指しています。'],[33,'壁には、寒さを測る温度計がずらり。'],[37,'ストーブの上では、やかんがしゅんしゅん。'],
[41,'棚には、ほかほかの缶。'],[46,'ベンチの模型には、そっと手を置いたあとのぬくもり。'],[51,'赤いマフラーは、ヌクモリのしるし。'],[56,'白い息をためた、小さな瓶。'],[61,'毛布のベッドで、ひと休み。'],[65,'今夜も、街のどこかをあたためています。']];

 sparks.forEach(w=>{const q=w.userData,p=(t*.05+q.p)%1;w.position.set(wpS.x+Math.sin(q.a+p*4)*2.6*(.4+p*.7),.3+p*2.6,wpS.z+Math.cos(q.a+p*4)*2.0*(.4+p*.7));w.material.opacity=.7*Math.sin(p*Math.PI)});
 for(let i=0;i<NS;i++){const b=sbase[i];sp0[i*3]=b[0]+Math.sin(t*.4+b[3])*.35+t*.12%1;sp0[i*3+1]=((b[1]-t*b[4]*.5)%9+9)%9;sp0[i*3+2]=b[2]+Math.cos(t*.3+b[3])*.25}
 sg2.attributes.position.needsUpdate=true;
 let k=0;caps.forEach((c,i)=>{if(lt>=c[0])k=i});if(k!==ci)setCap(k);
