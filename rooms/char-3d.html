<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3Dの部屋 — 見えない隣人たち</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{--bg:#1b1522;--ink:#f1e4d8;--btn:#3a2d45}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;padding:10px}
#frame{position:relative;background:#16111d;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px #0008;width:min(96vw,880px);aspect-ratio:16/9}
#frame.portrait{width:min(96vw,420px);aspect-ratio:9/16;max-height:78vh}
canvas{display:block;width:100%;height:100%}
#title{position:absolute;left:0;right:0;top:4%;text-align:center;font-weight:700;font-size:clamp(17px,3.4vw,26px);color:#ffe9cf;letter-spacing:.14em;text-shadow:0 0 .6em #000b;pointer-events:none}
#title small{display:block;font-weight:500;font-size:.55em;letter-spacing:.22em;opacity:.85;margin-top:.4em}
#cap{position:absolute;left:6%;right:6%;bottom:5%;text-align:center;font-weight:700;font-size:clamp(13px,2.6vw,19px);line-height:1.6;color:#fff3e2;text-shadow:0 0 .5em #000,0 .05em .4em #000;transition:opacity .6s;opacity:0;pointer-events:none}
#cap.on{opacity:1}
#hint{position:absolute;left:0;right:0;bottom:1.5%;text-align:center;font-size:11px;opacity:.65;pointer-events:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.1em;color:#ffe9cf;background:#16111d;transition:opacity .5s;text-align:center;padding:0 16px}
#bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:96vw}
button,a.btn{font:inherit;font-weight:700;background:var(--btn);color:var(--ink);border:2px solid #7a5f6e;border-radius:999px;padding:.4em 1.1em;cursor:pointer;text-decoration:none;font-size:14px}
button[aria-pressed="true"]{background:#f2b58e;color:#3b2218;border-color:#f2b58e}
#back{position:absolute;top:10px;left:10px;z-index:5;font-size:13px;padding:.3em .9em}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<a class="btn" id="back" href="../index.html#characters-preview">← 図鑑</a>
<div id="frame">
  <div id="loading">隣人を呼んでいます…</div>
  <div id="title"><span id="tName"></span><small id="tRoom"></small></div>
  <div id="cap"></div>
  <div id="hint">隣人をタップすると、言葉が出ます</div>
</div>
<div id="bar">
  <button id="bWalk" aria-pressed="true">歩く</button>
  <button id="bRun" aria-pressed="false">走る</button>
  <button id="bStop" aria-pressed="false">とまる</button>
  <button id="bL" aria-pressed="true">横 16:9</button>
  <button id="bP" aria-pressed="false">縦 9:16</button>
  <a class="btn" id="arLink" href="#">AR・3Dで見る →</a>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const CFG = {
 "susunomi": {
  "slug": "susunomi",
  "ep": "第1話の隣人",
  "name": "ススノミ",
  "room": "換気口の奥の小さな台所",
  "loc": "古びたアパートの換気口の奥にある小さな台所",
  "quote": "「なんだか今日は、懐かしい気分だな」",
  "theme": {
   "bg": "#241a20",
   "wall": "#3a2a26",
   "floor": "#4a3423",
   "rug": "#6b3a2e",
   "accent": "#ffb36b"
  }
 },
 "kagemichi": {
  "slug": "kagemichi",
  "ep": "第2話の隣人",
  "name": "カゲミチ",
  "room": "終点の駅の詰め所",
  "loc": "終電が終わった後の誰もいない駅のホーム",
  "quote": "「それでいい、とカゲミチは思う。」",
  "theme": {
   "bg": "#181a24",
   "wall": "#272b3a",
   "floor": "#33343c",
   "rug": "#3d4457",
   "accent": "#ffd9a0"
  }
 },
 "tokitsugi": {
  "slug": "tokitsugi",
  "ep": "第3話の隣人",
  "name": "トキツギ",
  "room": "押し入れの奥の時計工房",
  "loc": "どの家の押し入れの奥にもある、ほんのわずかな「隙間」",
  "quote": "「それは偶然ではない。トキツギが、静かに仕事をした証だ。」",
  "theme": {
   "bg": "#241a30",
   "wall": "#2e2138",
   "floor": "#4a3423",
   "rug": "#5d2f3a",
   "accent": "#f2b58e"
  }
 },
 "wasuredama": {
  "slug": "wasuredama",
  "ep": "第4話の隣人",
  "name": "ワスレダマ",
  "room": "街灯の下の落とし物置き場",
  "loc": "夜の街灯の下",
  "quote": "「そこには、昔の自分の夢が書いてあった。」",
  "theme": {
   "bg": "#14201e",
   "wall": "#1e2f2a",
   "floor": "#2c3833",
   "rug": "#37544a",
   "accent": "#ffe9a8"
  }
 },
 "nukumori": {
  "slug": "nukumori",
  "ep": "第5話の隣人",
  "name": "ヌクモリ",
  "room": "自動販売機の裏の小さな温度番",
  "loc": "真冬の夜の自動販売機の裏側（小さな湯気の立つ場所）",
  "quote": "「今日は、なんだか凍えないな」",
  "theme": {
   "bg": "#26161a",
   "wall": "#38202a",
   "floor": "#472a20",
   "rug": "#70352c",
   "accent": "#ffab7a"
  }
 },
 "henjirou": {
  "slug": "henjirou",
  "ep": "第6話の隣人",
  "name": "ヘンジロウ",
  "room": "ポストの中の返事書き",
  "loc": "赤い郵便ポストの底",
  "quote": "「相手は何も聞いていないのに、なぜか理解してくれる。」",
  "theme": {
   "bg": "#221418",
   "wall": "#331e24",
   "floor": "#402820",
   "rug": "#5f2f33",
   "accent": "#ffb59d"
  }
 },
 "tsumazuki": {
  "slug": "tsumazuki",
  "ep": "第7話の隣人",
  "name": "ツマヅキ",
  "room": "階段の踊り場の見張り番",
  "loc": "駅やアパートの階段の踊り場",
  "quote": "「つまずきそうになって踏みとどまる。それは偶然ではない。」",
  "theme": {
   "bg": "#191d26",
   "wall": "#262c3a",
   "floor": "#31333c",
   "rug": "#3f4a5e",
   "accent": "#cfe3ff"
  }
 },
 "kazoeru": {
  "slug": "kazoeru",
  "ep": "第8話の隣人",
  "name": "カゾエル",
  "room": "公園のブランコの数え役",
  "loc": "夜の公園の誰もいない揺れるブランコ",
  "quote": "「誰にも褒められなかった日でも、その頑張りは消えていない。」",
  "theme": {
   "bg": "#14211a",
   "wall": "#1f3025",
   "floor": "#2a3626",
   "rug": "#38543c",
   "accent": "#d8ffb0"
  }
 },
 "tomerun": {
  "slug": "tomerun",
  "ep": "第9話の隣人",
  "name": "トメルン",
  "room": "冷蔵庫の奥の時間保存士",
  "loc": "家庭の冷蔵庫の最奥にある小さな氷の小棚",
  "quote": "「“腐りそうな時間”を、ほんの少しだけ延ばしている。」",
  "theme": {
   "bg": "#122028",
   "wall": "#1b303c",
   "floor": "#24343c",
   "rug": "#2f5468",
   "accent": "#bdefff"
  }
 },
 "hoshihakobi": {
  "slug": "hoshihakobi",
  "ep": "第10話の隣人",
  "name": "ホシハコビ",
  "room": "屋根の上の星運び",
  "loc": "夜の屋根の上・煙突の周辺",
  "quote": "「それは、空の偶然ではない。」",
  "theme": {
   "bg": "#141228",
   "wall": "#201c42",
   "floor": "#2a2440",
   "rug": "#3a3468",
   "accent": "#ffe9a8"
  }
 },
 "yumeatsume": {
  "slug": "yumeatsume",
  "ep": "第11話の隣人",
  "name": "ユメアツメ",
  "room": "夢の保管庫の管理人",
  "loc": "常世町の西の丘の上にある大きな温室「夢の保管庫」",
  "quote": "「夢には賞味期限がないから。「おかえり」」",
  "theme": {
   "bg": "#20142c",
   "wall": "#2f1e42",
   "floor": "#38283e",
   "rug": "#543a68",
   "accent": "#e3c2ff"
  }
 },
 "namidabin": {
  "slug": "namidabin",
  "ep": "第12話の隣人",
  "name": "ナミダビン",
  "room": "涙瓶職人",
  "loc": "常世町の地下「涙蔵（なみだぐら）」",
  "quote": "「悲しみは、いつか輝きになる。それを知っているから。」",
  "theme": {
   "bg": "#101e2a",
   "wall": "#18303f",
   "floor": "#22333c",
   "rug": "#2c5568",
   "accent": "#a8e6ff"
  }
 },
 "ashitayobi": {
  "slug": "ashitayobi",
  "ep": "第13話の隣人",
  "name": "アシタヨビ",
  "room": "朝焼け配達人",
  "loc": "夜明け前の空・常世町の東門",
  "quote": "「明日は希望そのものじゃない。でも、希望を運ぶことはできる。」",
  "theme": {
   "bg": "#241a1e",
   "wall": "#37242c",
   "floor": "#40302a",
   "rug": "#6e453a",
   "accent": "#ffc9a3"
  }
 }
};
const slug = new URLSearchParams(location.search).get('c') || 'tokitsugi';
const C = CFG[slug] || CFG['tokitsugi'];
const T = C.theme;
document.title = `${C.name}の部屋 3D — 見えない隣人たち`;
document.getElementById('tName').textContent = `${C.name}の部屋`;
document.getElementById('tRoom').textContent = `${C.room} — 3D`;
document.getElementById('arLink').href = `viewer-char.html?c=${slug}`;
document.getElementById('loading').textContent = `${C.name}を呼んでいます…`;

const frame = document.getElementById('frame');
const cap = document.getElementById('cap');
const loading = document.getElementById('loading');

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
frame.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(T.bg);
scene.fog = new THREE.Fog(T.bg, 9, 16);
const camera = new THREE.PerspectiveCamera(42, 16/9, 0.1, 100);
camera.position.set(0, 1.9, 4.6);
camera.lookAt(0, 0.85, 0);

scene.add(new THREE.AmbientLight(0xffe6c4, 0.55));
const key = new THREE.DirectionalLight(0xffd9a0, 1.6);
key.position.set(2.5, 4.5, 3.5); key.castShadow = true; key.shadow.mapSize.set(1024,1024);
scene.add(key);
const lamp = new THREE.PointLight(new THREE.Color(T.accent), 12, 8, 1.8);
lamp.position.set(-2.2, 1.7, 0.6); scene.add(lamp);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(9, 6), new THREE.MeshStandardMaterial({ color:T.floor, roughness:0.9 }));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(9, 4.2), new THREE.MeshStandardMaterial({ color:T.wall, roughness:1 }));
wall.position.set(0, 2.1, -1.9); wall.receiveShadow = true; scene.add(wall);
const rug = new THREE.Mesh(new THREE.CircleGeometry(1.55, 40), new THREE.MeshStandardMaterial({ color:T.rug, roughness:1 }));
rug.rotation.x = -Math.PI/2; rug.position.y = 0.005; rug.receiveShadow = true; scene.add(rug);

// generic props: shelves with jars (left), small table (right), hanging lamp sphere
const woodMat = new THREE.MeshStandardMaterial({ color:0x3d2b1c, roughness:0.9 });
for (let i=0;i<3;i++){
  const s = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.07, 0.4), woodMat);
  s.position.set(-2.35, 0.8 + i*0.55, -1.65); s.castShadow = true; scene.add(s);
  for (let j=0;j<3;j++){
    const jar = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.26,14),
      new THREE.MeshStandardMaterial({ color:[0x9fc6b8,0xe8b4b8,0xf2d492][(i+j)%3], roughness:0.35 }));
    jar.position.set(-2.85 + j*0.45, 0.97 + i*0.55, -1.65); jar.castShadow = true; scene.add(jar);
  }
}
const table = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.09, 0.6), woodMat);
table.position.set(2.4, 0.78, -1.55); table.castShadow = true; scene.add(table);
for (const dx of [-0.65, 0.65]) for (const dz of [-0.22, 0.22]) {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.07,0.78,0.07), woodMat);
  leg.position.set(2.4+dx, 0.39, -1.55+dz); scene.add(leg);
}
const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.09, 14, 12), new THREE.MeshBasicMaterial({ color:new THREE.Color(T.accent) }));
bulb.position.set(-2.2, 1.7, 0.6); scene.add(bulb);

let mixer = null, actions = {}, current = null, charObj = null;
let mode = 'walk', angle = Math.PI * 0.25;
const PATH_RX = 1.05, PATH_RZ = 0.5;
new GLTFLoader().load(`models/${slug}.glb`, (gltf) => {
  charObj = gltf.scene;
  charObj.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(charObj);
  mixer = new THREE.AnimationMixer(charObj);
  for (const clip of gltf.animations) actions[clip.name] = mixer.clipAction(clip);
  play('Walking');
  loading.style.opacity = '0'; setTimeout(()=> loading.remove(), 600);
  showCap(`${C.name}が、部屋を歩いています。`);
}, undefined, () => { loading.textContent = '読み込みに失敗しました。通信環境を確認してもう一度開いてください。'; });

function play(name){
  if (!actions[name]) return;
  if (current && current !== actions[name]) current.fadeOut(0.25);
  current = actions[name]; current.reset().fadeIn(0.25).play();
}
function showCap(text){
  cap.textContent = text; cap.classList.add('on');
  clearTimeout(showCap._t); showCap._t = setTimeout(()=> cap.classList.remove('on'), 4200);
}
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (!charObj) return;
  const r = renderer.domElement.getBoundingClientRect();
  ptr.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  ptr.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  if (ray.intersectObject(charObj, true).length) showCap(C.quote);
});
const bWalk = document.getElementById('bWalk'), bRun = document.getElementById('bRun'), bStop = document.getElementById('bStop');
function setMode(m){
  mode = m;
  for (const [b, v] of [[bWalk,'walk'],[bRun,'run'],[bStop,'stop']]) b.setAttribute('aria-pressed', String(m===v));
  if (!mixer) return;
  if (m === 'walk') play('Walking');
  if (m === 'run') play('Running');
  if (m === 'stop' && current) { current.fadeOut(0.2); current = null; }
}
bWalk.onclick = () => setMode('walk'); bRun.onclick = () => setMode('run'); bStop.onclick = () => setMode('stop');
const bL = document.getElementById('bL'), bP = document.getElementById('bP');
function setAspect(portrait){
  frame.classList.toggle('portrait', portrait);
  bL.setAttribute('aria-pressed', String(!portrait)); bP.setAttribute('aria-pressed', String(portrait));
  resize();
}
bL.onclick = () => setAspect(false); bP.onclick = () => setAspect(true);
function resize(){
  const w = frame.clientWidth, h = frame.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
const clockT = new THREE.Clock();
(function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clockT.getDelta(), 0.05), t = clockT.elapsedTime;
  if (mixer) mixer.update(dt);
  if (charObj && mode !== 'stop') {
    angle += (mode === 'run' ? 0.85 : 0.32) * dt;
    const x = Math.cos(angle) * PATH_RX, z = Math.sin(angle) * PATH_RZ;
    const nx = Math.cos(angle + 0.02) * PATH_RX, nz = Math.sin(angle + 0.02) * PATH_RZ;
    charObj.position.set(x, 0, z); charObj.rotation.y = Math.atan2(nx - x, nz - z);
  }
  lamp.intensity = 12 + Math.sin(t * 7.3) * 0.9 + Math.sin(t * 13.7) * 0.5;
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
